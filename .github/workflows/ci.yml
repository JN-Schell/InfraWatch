name: CI
on:
  push: { branches: [main] }
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "server[dev]" -e "agent[dev]"
      - name: Ruff (lint)
        run: ruff check server agent tests
      - name: mypy (type check application packages)
        run: mypy server/infrawatch_server agent/infrawatch_agent

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e server[dev] -e agent[dev]
      - name: Server unit/API tests (SQLite)
        run: pytest server/tests -q
      - name: Agent tests
        run: pytest agent/tests -q
      - name: Agent <-> server integration (real sockets, TLS)
        run: pytest tests/integration -q

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: infrawatch }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e server[dev]
      - name: Server tests against PostgreSQL/TimescaleDB
        env:
          INFRAWATCH_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/infrawatch
          INFRAWATCH_TEST_EXPECT_TIMESCALE: "1"  # fail (don't skip) if the extension is missing
        run: pytest server/tests -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e server -e agent
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          PYTHON=$(which python) npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: frontend/test-results }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t infrawatch:ci .
      - name: Compose file validates
        run: POSTGRES_PASSWORD=x INFRAWATCH_SECRET_KEY=x INFRAWATCH_ADMIN_PASSWORD=x docker compose config -q
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./agent
      - name: Docker Compose end-to-end smoke test
        run: scripts/compose_smoke.sh
